<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skincare">
<meta name="theme-color" content="#FFFFFF">
<title>Skincare Natalia Luzak</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,arrow_back,arrow_downward,arrow_upward,backspace,badge,calendar_month,cancel,check,check_circle,chevron_left,chevron_right,close,cloud_off,delete,download,edit,edit_note,error,event_note,event_repeat,group,ios_share,keep,logout,more_vert,notifications,person_add,restart_alt,settings,sms,sort_by_alpha,spa,subdirectory_arrow_right,tune,water_drop&display=block">
<style>
:root{
  --rose:#9A7820;--rose2:#7A5F17;--blush:#F8F1DE;--cream:#FFFDF8;--gold:#D9B65A;
  --text:#2B2620;--muted:#8F857A;--border:rgba(154,120,32,.2);--green:#4E9A73;--red:#D14B4B;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--cream);color:var(--text);min-height:100vh;padding-bottom:6rem}
header{background:#fff;color:var(--text);border-bottom:2px solid var(--gold);padding:calc(.8rem + env(safe-area-inset-top)) 1rem .8rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(154,120,32,.15)}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.02rem;letter-spacing:.01em;color:var(--rose2);font-family:Georgia,'Times New Roman',serif}
.logo img{width:34px;height:34px;border-radius:50%}
.logo small{display:block;font-weight:400;font-size:.64rem;color:var(--muted);letter-spacing:.18em;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif}
.hdr-r{display:flex;align-items:center;gap:.45rem}
.dot{width:9px;height:9px;border-radius:50%;background:#7BE0A8}
.dot.syncing{background:#F5C16B;animation:pulse 1s infinite}
.dot.error{background:#FF8A8A}
@keyframes pulse{50%{opacity:.3}}
.lock-btn{display:inline-flex;align-items:center;gap:.3rem;background:none;border:1.5px solid var(--gold);color:var(--rose2);border-radius:20px;padding:.35rem .8rem;font-size:.78rem;font-weight:700;font-family:inherit;cursor:pointer}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:90}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:.35rem;padding:.75rem .5rem;text-align:center;font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;user-select:none}
.tab.active{color:var(--rose);border-color:var(--rose)}
.pane{display:none}.pane.active{display:block}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:#fff}
.cal-nav button{display:flex;align-items:center;background:none;border:none;font-size:1.6rem;color:var(--rose);padding:.1rem .6rem;cursor:pointer;line-height:1}
#cal-label{font-weight:800;text-transform:capitalize}
.wd{display:grid;grid-template-columns:repeat(7,1fr);padding:.2rem .5rem 0;background:#fff}
.wd span{text-align:center;font-size:.66rem;font-weight:800;color:var(--muted);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;padding:.5rem;background:#fff;border-bottom:1px solid var(--border)}
.day{aspect-ratio:1;border-radius:11px;background:var(--blush);display:flex;align-items:center;justify-content:center;position:relative;font-weight:700;font-size:.9rem;cursor:pointer;border:2px solid transparent;user-select:none}
.day.other{opacity:.35}
.day.has{background:var(--rose);color:#fff}
.day.has.past{background:var(--muted)}
.day.today{border-color:var(--gold)}
.day.sel{box-shadow:0 0 0 2.5px var(--rose2) inset}
.day .cnt{position:absolute;top:3px;right:5px;font-size:.6rem;font-weight:800}
.day-head{padding:.9rem 1rem .3rem;font-weight:800;font-size:.95rem;display:flex;justify-content:space-between;align-items:baseline}
.day-head span{font-size:.75rem;color:var(--muted);font-weight:600}
.visit{background:#fff;border-radius:14px;margin:.5rem .75rem;padding:.7rem .9rem;box-shadow:0 1px 6px rgba(58,40,38,.08);display:flex;gap:.8rem;align-items:flex-start;cursor:pointer;border-left:5px solid var(--rose)}
.visit.st-done{border-left-color:var(--green);opacity:.85}
.visit.st-noshow{border-left-color:var(--red);opacity:.8}
.visit.st-noshow .v-name{text-decoration:line-through}
.visit.st-moved{border-left-color:#E0A030;opacity:.85}
.visit.st-other{border-left-color:var(--muted);opacity:.85}
.badge.red{background:#FBE0E0;color:var(--red)}
.badge.amber{background:#FFF0CC;color:#9A6B00}
.badge.grey{background:#ECE8E2;color:var(--muted)}
.visit:active{opacity:.7}
.v-time{font-weight:800;color:var(--rose);min-width:46px;font-size:.95rem}
.v-main{flex:1;min-width:0}
.v-name{font-weight:800;font-size:.93rem}
.v-treat{font-size:.82rem;color:var(--text);margin-top:.1rem}
.v-note{font-size:.76rem;color:var(--muted);margin-top:.15rem}
.empty{text-align:center;color:var(--muted);padding:2rem 1rem;font-size:.88rem}

/* CLIENTS */
.search{padding:.7rem .75rem .3rem}
.search input{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:12px;font-size:.95rem;font-family:inherit;background:#fff;outline:none}
.search input:focus{border-color:var(--rose)}
.client{background:#fff;border-radius:14px;margin:.5rem .75rem;padding:.75rem .95rem;box-shadow:0 1px 6px rgba(58,40,38,.08);display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:.6rem}
.client:active{opacity:.7}
.c-name{font-weight:800;font-size:.94rem}
.c-sub{font-size:.78rem;color:var(--muted);margin-top:.1rem}
.c-cnt{font-size:.74rem;color:var(--rose);font-weight:800;white-space:nowrap}

/* FAB */
.fab{display:flex;align-items:center;justify-content:center;position:fixed;right:1.2rem;bottom:calc(1.4rem + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#C9A24A,#9A7820);color:#fff;border:none;font-size:1.9rem;box-shadow:0 4px 20px rgba(122,95,23,.45);cursor:pointer;z-index:90}
.fab:active{transform:scale(.93)}

/* SHEETS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:1.1rem 1.2rem calc(2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 1rem}
.s-title{font-size:1.08rem;font-weight:800;margin-bottom:.9rem}
.fg{margin-bottom:.8rem;position:relative}
.fl{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.3rem}
.fi{width:100%;padding:.68rem .8rem;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;font-family:inherit;color:var(--text);background:#fff;outline:none}
.fi:focus{border-color:var(--rose)}
.fi.err{border-color:var(--red)}
textarea.fi{resize:vertical;min-height:76px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.ac{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--rose);border-radius:10px;z-index:300;max-height:170px;overflow-y:auto;margin-top:2px;box-shadow:0 4px 20px rgba(0,0,0,.14);display:none}
.ac div{padding:.6rem .8rem;border-bottom:1px solid var(--border);font-size:.9rem;cursor:pointer}
.ac div:last-child{border-bottom:none}
.ac small{display:block;color:var(--muted);font-size:.74rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;padding:.85rem;border:none;border-radius:12px;font-size:.98rem;font-weight:800;font-family:inherit;cursor:pointer;margin-top:.5rem;background:linear-gradient(135deg,#B8932F,#9A7820);color:#fff}
.btn:active{opacity:.8}
.btn.ghost{background:none;border:1.5px solid var(--border);color:var(--text)}
.btn.green{background:var(--green)}
.btn.danger{background:var(--red)}
.btn.out{background:none;border:1.5px solid var(--rose);color:var(--rose)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.grid2 .btn{margin-top:0;font-size:.85rem;padding:.75rem .4rem}
.d-name{font-size:1.2rem;font-weight:800}
.d-sub{font-size:.86rem;color:var(--muted);margin-bottom:.8rem}
.d-row{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--border);font-size:.9rem}
.d-row:last-of-type{border-bottom:none}
.d-row .l{color:var(--muted);font-size:.8rem;white-space:nowrap}
.d-row .v{font-weight:600;text-align:right}
.d-row a{color:var(--rose);text-decoration:none;font-weight:700}
.note-box{background:#FFF6E0;border:1px solid #EBD9A6;border-radius:10px;padding:.65rem .8rem;font-size:.86rem;margin-top:.8rem;white-space:pre-wrap;line-height:1.4}
.sec{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:1.1rem 0 .4rem}
.hist{padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.86rem;cursor:pointer}
.hist:last-child{border-bottom:none}
.hist b{color:var(--rose)}
.hist .n{color:var(--muted);font-size:.78rem}
.badge{display:inline-flex;align-items:center;gap:.2rem;vertical-align:middle;font-size:.66rem;font-weight:800;padding:.1rem .45rem;border-radius:6px;background:#DDF2E6;color:var(--green);margin-left:.4rem}

.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:.4rem .75rem;font-size:.82rem;font-weight:600;font-family:inherit;color:var(--text);cursor:pointer}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.addrow{display:flex;gap:.4rem;margin-top:.5rem}
.addrow .fi{padding:.5rem .7rem;font-size:.85rem}
.mini{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gold);background:none;color:var(--rose2);border-radius:10px;width:44px;font-size:1.2rem;font-weight:800;cursor:pointer;font-family:inherit}
.v-price{font-weight:800;color:var(--rose2);font-size:.85rem;white-space:nowrap}
.v-prod{font-size:.76rem;color:var(--muted);margin-top:.15rem}
.summary{margin:.5rem .75rem;padding:.8rem .9rem;background:linear-gradient(135deg,#FBF3DC,#F4E6B8);border:1px solid var(--gold);border-radius:14px;display:flex;gap:.5rem;justify-content:space-between}
.summary div{text-align:center;flex:1}
.summary b{display:block;font-size:1.05rem;color:var(--rose2)}
.summary span{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sortrow{display:flex;flex-wrap:wrap;gap:.5rem;padding:.2rem .75rem .1rem}
.sbtn{display:flex;align-items:center;justify-content:center;gap:.25rem;flex:1 1 auto;padding:.5rem .4rem;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:.78rem;font-weight:700;color:var(--text);font-family:inherit;cursor:pointer}
.sbtn.active{background:var(--rose);border-color:var(--rose);color:#fff}
.c-right{text-align:right}
.c-spent{font-weight:800;color:var(--rose2);font-size:.9rem}
.c-vis{font-size:.72rem;color:var(--muted)}
.bell{position:relative}
.bell-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-sizing:content-box;line-height:1}
.notif{display:flex;align-items:center;gap:.7rem;padding:.75rem .7rem;margin:.45rem 0;border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:12px;background:#fff;cursor:pointer}
.notif:active{background:var(--blush)}
.notif .ni{width:38px;height:38px;border-radius:50%;background:var(--blush);color:var(--rose2);display:flex;align-items:center;justify-content:center;flex:none}
.notif .nb{flex:1;min-width:0}
.notif .nt{font-weight:800;font-size:.9rem}
.notif .ns{font-size:.78rem;color:var(--muted);margin-top:.1rem}
.sent{font-size:.76rem;color:var(--green);margin:.3rem 0 .1rem;display:flex;align-items:center;gap:.25rem;font-weight:600}
.linkbtn{background:none;border:none;color:var(--rose2);font-size:.78rem;font-weight:700;text-decoration:underline;cursor:pointer;font-family:inherit;padding:.3rem 0}
.mi{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:1.25em;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;vertical-align:-.2em;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;user-select:none;flex:none}
.fab .mi{font-size:2rem;vertical-align:0}
.pad button .mi{font-size:1.7rem;vertical-align:0}
.icon-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:none;border:1.5px solid var(--gold);color:var(--rose2);cursor:pointer}
.setrow{display:flex;align-items:center;gap:.3rem;padding:.3rem 0;border-bottom:1px solid var(--border);font-size:.9rem}
.setrow .nm{flex:1;min-width:0;word-break:break-word}
.setrow .fi{padding:.45rem .6rem;font-size:.88rem;flex:1;min-width:0}
.ibtn{display:flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;border:none;background:none;border-radius:10px;color:var(--rose2);cursor:pointer}
.ibtn.del{color:var(--red)}
.ibtn:active{background:var(--blush)}
.chkrow{display:flex;align-items:center;gap:.5rem;font-size:.88rem;margin:.2rem 0 .5rem}
.chkrow input{width:20px;height:20px;accent-color:var(--rose)}
.toast .mi{margin-right:.3rem}
.toast{position:fixed;bottom:6rem;left:50%;transform:translateX(-50%) translateY(10px);max-width:92vw;white-space:normal;text-align:center;background:var(--rose2);color:#fff;padding:.55rem 1.2rem;border-radius:30px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* PIN */
#pin{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:2rem}
#pin img{width:132px;height:132px;border-radius:50%}
.p-title{color:var(--rose2);font-size:1.3rem;font-weight:700;text-align:center;font-family:Georgia,'Times New Roman',serif;letter-spacing:.02em}
.p-sub{color:var(--muted);font-size:.82rem;margin-top:-.9rem}
.p-dots{display:flex;gap:.8rem}
.p-dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--gold);transition:.15s}
.p-dot.f{background:var(--rose);border-color:var(--rose)}
.p-dot.e{background:var(--red);border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;width:264px}
.pad button{display:flex;align-items:center;justify-content:center;background:var(--blush);border:1px solid var(--border);border-radius:50%;width:72px;height:72px;justify-self:center;font-size:1.45rem;font-weight:600;color:var(--rose2);font-family:inherit;cursor:pointer}
.pad button:active{background:#EBD9A0}
.pad .x{background:none;pointer-events:none}
.p-err{color:var(--red);font-size:.84rem;font-weight:700;min-height:1.1rem}
.install{display:none;margin:.5rem .75rem;padding:.7rem .9rem;background:var(--blush);border-radius:12px;font-size:.82rem;line-height:1.4;border:1px solid var(--border)}
.install.show{display:block}
</style>
</head>
<body>

<div id="pin">
  <img src="logo.png" alt="">
  <div class="p-title">Skincare Natalia Luzak</div>
  <div class="p-sub">Podaj kod PIN</div>
  <div class="p-dots" id="p-dots"><div class="p-dot"></div><div class="p-dot"></div><div class="p-dot"></div><div class="p-dot"></div></div>
  <div class="p-err" id="p-err"></div>
  <div class="pad" id="pad"></div>
</div>

<div id="login" style="display:none;position:fixed;inset:0;background:#fff;z-index:9000;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem">
  <img src="logo.png" alt="" style="width:110px;height:110px;border-radius:50%">
  <div class="p-title">Logowanie</div>
  <form onsubmit="event.preventDefault();doLogin();" style="display:flex;flex-direction:column;gap:.7rem;width:min(320px,86vw)">
    <input type="email" id="login-email" class="fi" placeholder="E-mail" autocomplete="username" inputmode="email">
    <input type="password" id="login-pass" class="fi" placeholder="Hasło" autocomplete="current-password">
    <div id="login-err" style="color:var(--red);font-size:.85rem;min-height:1.1rem;text-align:center;font-weight:600"></div>
    <button type="submit" id="login-btn" class="btn" style="margin-top:0">Zaloguj</button>
  </form>
</div>

<header>
  <div class="logo"><img src="logo.png" alt=""><div>Skincare<small>NATALIA LUZAK</small></div></div>
  <div class="hdr-r"><span class="dot" id="dot" title="Synchronizacja"></span><button class="icon-btn bell" id="bell" onclick="openNotifs()" aria-label="Powiadomienia"><span class="mi">notifications</span><span class="bell-badge" id="bell-badge" style="display:none">0</span></button><button class="icon-btn" onclick="openSettings()" aria-label="Ustawienia"><span class="mi">settings</span></button><button class="lock-btn" onclick="lockApp()"><span class="mi">logout</span>Wyloguj</button></div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('cal')"><span class="mi">calendar_month</span>Kalendarz</div>
  <div class="tab" onclick="switchTab('cli')"><span class="mi">group</span>Klienci<span id="cli-count"></span></div>
</div>

<div class="install" id="install-tip"></div>

<div class="pane active" id="pane-cal">
  <div class="cal-nav"><button onclick="changeMonth(-1)" aria-label="Poprzedni miesiąc"><span class="mi">chevron_left</span></button><div id="cal-label"></div><button onclick="changeMonth(1)" aria-label="Następny miesiąc"><span class="mi">chevron_right</span></button></div>
  <div class="wd"><span>Pn</span><span>Wt</span><span>Śr</span><span>Cz</span><span>Pt</span><span>So</span><span>Nd</span></div>
  <div class="grid" id="grid"></div>
  <div class="day-head"><div id="day-title"></div><span id="day-sub"></span></div>
  <div id="day-list"></div>
</div>

<div class="pane" id="pane-cli">
  <div class="search"><input type="search" id="cli-search" placeholder="Szukaj: imię, nazwisko lub telefon…" oninput="renderClients()" autocomplete="off"></div>
  <div class="summary" id="cli-sum"></div>
  <div class="sortrow" id="sortrow"></div>
  <div id="cli-list"></div>
</div>

<button class="fab" onclick="openVisit()" aria-label="Dodaj wizytę"><span class="mi">add</span></button>

<!-- Wizyta: formularz -->
<div class="overlay" id="ov-visit"><div class="sheet">
  <div class="handle"></div>
  <div class="s-title" id="v-title">Nowa wizyta</div>
  <div class="row2">
    <div class="fg"><label class="fl">Data</label><input type="date" class="fi" id="v-date"></div>
    <div class="fg"><label class="fl">Godzina</label><input type="time" class="fi" id="v-time" step="900" value="10:00"></div>
  </div>
  <div class="fg"><label class="fl">Imię i nazwisko</label>
    <input type="text" class="fi" id="v-name" placeholder="np. Anna Nowak" autocomplete="off" oninput="onNameInput()">
    <div class="ac" id="v-ac"></div>
  </div>
  <div class="fg"><label class="fl">Telefon</label><input type="tel" class="fi" id="v-phone" placeholder="500-123-456" onblur="this.value=fmtPhone(this.value)"></div>
  <div class="fg"><label class="fl">Zabiegi <span style="text-transform:none;letter-spacing:0;font-weight:400">(opcjonalnie, można kilka)</span></label>
    <div class="chips" id="treat-chips"></div>
    <div class="addrow"><input class="fi" id="treat-new" placeholder="Własny zabieg…" autocomplete="off"><button type="button" class="mini" onclick="addCustom('treat')" aria-label="Dodaj"><span class="mi">add</span></button></div>
  </div>
  <div class="fg"><label class="fl">Użyte preparaty <span style="text-transform:none;letter-spacing:0;font-weight:400">(opcjonalnie, można kilka)</span></label>
    <div class="chips" id="prod-chips"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
// ─── PIN ───
const PIN_HASH = '44c59909f17c296d6f2ec4a53efac3a951add75aa67616d9c5d9d2f5fbb44f04';
let pinBuf = '', fails = 0, lockUntil = 0;
const padEl = $('pad');
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
  const b=document.createElement('button');
  if(k==='')b.className='x'; else if(k==='⌫')b.innerHTML='<span class="mi">backspace</span>'; else b.textContent=k;
  if(k!=='')b.onclick=()=>pinKey(k);
  padEl.appendChild(b);
});
function drawDots(err){document.querySelectorAll('.p-dot').forEach((d,i)=>{d.className='p-dot'+(err?' e':i<pinBuf.length?' f':'');});}
async function sha(s){
  if(!(window.crypto&&crypto.subtle))return s==='2112'?PIN_HASH:'';
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function pinKey(k){
  if(Date.now()<lockUntil){$('p-err').textContent='Poczekaj '+Math.ceil((lockUntil-Date.now())/1000)+' s';return;}
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);drawDots();return;}
  if(pinBuf.length>=4)return;
  pinBuf+=k;drawDots();
  if(pinBuf.length<4)return;
  if(await sha(pinBuf)===PIN_HASH){
    fails=0;$('p-err').textContent='';
    sessionStorage.setItem('sk-unlocked','1');
    $('pin').style.display='none';pinBuf='';drawDots();
    window.__unlocked=true;if(window.__startApp)window.__startApp();
  } else {
    fails++;drawDots(true);
    $('p-err').textContent=fails>=5?'Za dużo prób — odczekaj 30 s':'Nieprawidłowy PIN';
    if(fails>=5){lockUntil=Date.now()+30000;fails=0;}
    if(navigator.vibrate)navigator.vibrate(200);
    setTimeout(()=>{pinBuf='';drawDots();},500);
  }
}
window.lockApp = ()=>{sessionStorage.removeItem('sk-unlocked');location.reload();};
// automatyczna blokada po dłuższym czasie w tle
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)hiddenAt=Date.now();
  else if(hiddenAt&&Date.now()-hiddenAt>120000&&$('pin').style.display==='none')lockApp();
});


if(sessionStorage.getItem('sk-unlocked')==='1'){$('pin').style.display='none';window.__unlocked=true;}
})();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot, query, where, updateDoc }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOGm3N-8zPtjvVv7hx1F-jqFpBU-dD7RY",
  authDomain: "rezerwacja-af82e.firebaseapp.com",
  projectId: "rezerwacja-af82e",
  storageBucket: "rezerwacja-af82e.firebasestorage.app",
  messagingSenderId: "316318620114",
  appId: "1:316318620114:web:453d19957ab0af4f8b100b"
};
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const auth = getAuth(app);

// Osobne kolekcje — nie mieszają się z danymi kawiarni
const C_CLIENTS = 'skincare_clients';
const C_VISITS  = 'skincare_visits';
const C_SETTINGS = 'skincare_settings';

// ─── STAN ───
const $ = id => document.getElementById(id);
const pad2 = n => n<10 ? '0'+n : ''+n;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
const todayStr = () => ymd(new Date());

let clients = {};        // id -> client
let monthVisits = {};    // id -> visit (bieżący miesiąc)
let curDate = todayStr();
let calY = new Date().getFullYear(), calM = new Date().getMonth();
let unsubMonth = null, started = false;
let editVisitId = null, pickedClientId = null;
let allVisits = {};
let clientSort = 'alpha';
const sortDirs = {alpha:1, bookings:-1, added:-1};

// ─── IKONY (Google Material Symbols) ───
const ic = (n,cls='') => `<span class="mi${cls?' '+cls:''}">${n}</span>`;

// ─── USTAWIENIA (zabiegi, preparaty, powody, godzina, treść SMS) ───
const DEFAULT_SETTINGS = {
  treat:['Oczyszczanie wodorowe','Mezoterapia mikroigłowa','Peeling kwasowy','Peeling kawitacyjny','Mikrodermabrazja','Masaż twarzy','Henna brwi i rzęs','Laminacja brwi','Zabieg nawilżający','Zabieg przeciwtrądzikowy','Zabieg anti-aging','Dermapen'],
  prod:['Serum z witaminą C','Serum z kwasem hialuronowym','Krem nawilżający','Krem z filtrem SPF 50','Maska algowa','Peeling migdałowy','Kwas azelainowy','Kwas salicylowy','Retinol','Tonik','Żel do mycia twarzy','Ampułka'],
  reasons:['Choroba klientki','Klientka odwołała wizytę','Brak kontaktu z klientką','Nieobecność w gabinecie','Zmiana planów'],
  defaultTime:'10:00',
  smsTemplate:'Dzień dobry, {imie}! \n\nPrzypominam o wizycie w gabinecie SkinCare Natalia Luzak: {data} ({dzien}) o {godzina}. \n\nDo zobaczenia!',
  smsConfirm:'Dzień dobry, {imie}! \n\nPotwierdzam Twoją wizytę w gabinecie SkinCare Natalia Luzak: {data} ({dzien}) o {godzina}. \nW razie zmiany terminu proszę o kontakt. \n\nDo zobaczenia!',
  smsNoDiacritics:true
};
const cloneDef = () => JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
function normSettings(o){
  const d=cloneDef();
  if(!o||typeof o!=='object')return d;
  ['treat','prod','reasons'].forEach(k=>{if(Array.isArray(o[k]))d[k]=o[k].filter(x=>typeof x==='string'&&x.trim());});
  if(typeof o.defaultTime==='string'&&/^\d\d:\d\d$/.test(o.defaultTime))d.defaultTime=o.defaultTime;
  if(typeof o.smsNoDiacritics==='boolean')d.smsNoDiacritics=o.smsNoDiacritics;
  return d;
}
let settings=null, settingsCloud=false;
try{const raw=localStorage.getItem('sk-settings');if(raw)settings=normSettings(JSON.parse(raw));}catch{}
if(!settings){
  settings=cloneDef();
  // przeniesienie własnych pozycji z poprzedniej wersji aplikacji
  try{const o=JSON.parse(localStorage.getItem('sk-opts'));if(o){['treat','prod'].forEach(k=>{(o[k]||[]).forEach(x=>{if(x&&!settings[k].includes(x))settings[k].push(x);});});}}catch{}
}
function saveSettings(){
  try{localStorage.setItem('sk-settings',JSON.stringify(settings));}catch{}
  setDoc(doc(db,C_SETTINGS,'main'),settings)
    .then(()=>{if(!settingsCloud){settingsCloud=true;renderSettingsIfOpen();}})
    .catch(()=>{if(settingsCloud){settingsCloud=false;renderSettingsIfOpen();}});
}

// ─── ZABIEGI I PREPARATY w formularzu wizyty ───
const sel = {treat:new Set(), prod:new Set()};
function renderChips(k){
  const base=settings[k];
  const all=[...base, ...[...sel[k]].filter(x=>!base.includes(x))];
  $(k+'-chips').innerHTML=all.map(x=>`<button type="button" class="chip${sel[k].has(x)?' on':''}" data-k="${k}" data-v="${esc(x)}">${esc(x)}</button>`).join('');
}
document.addEventListener('click',e=>{
  const c=e.target.closest&&e.target.closest('.chip');if(!c||!c.dataset.k)return;
  const k=c.dataset.k,v=c.dataset.v;
  if(sel[k].has(v))sel[k].delete(v);else sel[k].add(v);
  renderChips(k);
});
window.addCustom = k=>{
  const inp=$(k+'-new'), v=inp.value.trim();if(!v)return;
  if(!settings[k].some(x=>x.toLowerCase()===v.toLowerCase())){settings[k].push(v);saveSettings();}
  sel[k].add(v);inp.value='';renderChips(k);
};
function setSel(v){
  sel.treat=new Set(v&&v.treatments&&v.treatments.length?v.treatments:(v&&v.treatment?[v.treatment]:[]));
  sel.prod=new Set(v&&v.products?v.products:[]);
  renderChips('treat');renderChips('prod');
}
function bezOgonkow(s){const m={'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z','Ą':'A','Ć':'C','Ę':'E','Ł':'L','Ń':'N','Ó':'O','Ś':'S','Ź':'Z','Ż':'Z'};return String(s||'').replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g,c=>m[c]);}
// Dane SMS: numer, treść z szablonu (Ustawienia) i link „sms:” otwierający aplikację SMS w telefonie
function smsData(v,kind){
  const c=clients[v.clientId], d=phoneDigits((c&&c.phone)||'');
  if(!d)return null;
  const [y,m,dd]=v.date.split('-').map(Number);
  const dz=DNI[new Date(y,m-1,dd).getDay()];
  const imie=((c&&c.name)||v.clientName||'').trim().split(/\s+/)[0]||'';
  let body=kind==='confirm'?settings.smsConfirm:settings.smsTemplate;
  if(!imie)body=body.replace(/,?\s*\{imie\}/g,'');
  body=body.replace(/\{imie\}/g,imie).replace(/\{data\}/g,pad2(dd)+'.'+pad2(m)).replace(/\{dzien\}/g,dz).replace(/\{godzina\}/g,v.time||'');
  if(settings.smsNoDiacritics)body=bezOgonkow(body);
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return {phone:fmtPhone(d),body,link:'sms:+48'+d+(ios?'&':'?')+'body='+encodeURIComponent(body)};
}
const fmtSent = iso => {const d=new Date(iso);return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());};
const visStatus = v => v.status || (v.done ? 'done' : null);
// [ikona, etykieta przycisku, krótko, klasa plakietki]
const STATUS = {done:['check_circle','Obecna','obecna',''],noshow:['cancel','Nieobecna','nieobecna','red'],moved:['event_repeat','Przełożona','przełożona','amber'],other:['edit_note','Inny powód','inny powód','grey']};
const dm = s => {const [y,m,d]=String(s).split('-');return d+'.'+m;};
const statusBadge = v => {const s=STATUS[visStatus(v)];return s?`<span class="badge ${s[3]}">${ic(s[0])}${s[2]}</span>`:'';};
const movedBadge = v => (v.movedFrom&&v.movedFrom.date)?`<span class="badge amber">${ic('event_repeat')}z ${dm(v.movedFrom.date)}${v.movedFrom.time?' '+esc(v.movedFrom.time):''}</span>`:'';
const visBadges = v => statusBadge(v)+movedBadge(v);
// do wydatków liczą się tylko wizyty, które się odbyły (nie nieobecność / przełożona / inny powód)
function countsAsSpent(v){const s=visStatus(v);if(s==='noshow'||s==='moved'||s==='other')return false;return v.date<=todayStr()||s==='done';}
const visTreat = v => (v.treatments&&v.treatments.length)?v.treatments.join(', '):(v.treatment||'');
const fmtMoney = n => (Math.round(n*100)/100).toLocaleString('pl-PL')+' zł';
function clientStats(){
  const st={};
  Object.values(allVisits).forEach(v=>{
    if(!v.clientId)return;
    const s=st[v.clientId]||(st[v.clientId]={spent:0,visits:0,noshow:0,bookings:0});
    s.bookings++;
    if(visStatus(v)==='noshow')s.noshow++;
    if(countsAsSpent(v)){s.visits++;if(v.price>0)s.spent+=v.price;}
  });
  return st;
}

const MIES = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MIES_G = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const DNI = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
function fmtDate(s){const [y,m,d]=s.split('-').map(Number);return d+' '+MIES_G[m-1]+' '+y;}
function fmtDay(s){const [y,m,d]=s.split('-').map(Number);return d+' '+MIES_G[m-1]+' ('+DNI[new Date(y,m-1,d).getDay()]+')';}

function setSync(s){$('dot').className='dot'+(s==='syncing'?' syncing':s==='error'?' error':'');}
window.toast = m => {const t=$('toast');const bad=/^Błąd/.test(m);t.innerHTML=ic(bad?'error':'check_circle')+esc(m);t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2600);};
window.closeOv = id => $(id).classList.remove('show');
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o&&o.id!=='ov-conf')o.classList.remove('show');}));

function confirmBox(msg, yesLabel='Usuń'){
  return new Promise(res=>{
    $('conf-msg').textContent=msg; $('conf-yes').textContent=yesLabel;
    $('ov-conf').classList.add('show');
    const done=v=>{$('ov-conf').classList.remove('show');$('conf-yes').onclick=$('conf-no').onclick=null;res(v);};
    $('conf-yes').onclick=()=>done(true); $('conf-no').onclick=()=>done(false);
  });
}

// ─── TELEFON ───
function phoneDigits(v){let d=(v||'').replace(/\D/g,'');if(d.startsWith('0048'))d=d.slice(4);else if(d.startsWith('48')&&d.length>9)d=d.slice(2);return d.slice(0,9);}
function fmtPhone(v){const d=phoneDigits(v);return [d.slice(0,3),d.slice(3,6),d.slice(6,9)].filter(Boolean).join('-');}
window.fmtPhone = fmtPhone;

// ─── START ───
function startApp(){
  if(started)return;started=true;
  setSync('syncing');
  setInterval(renderBell,60000);
  const go=()=>{
    onSnapshot(collection(db,C_CLIENTS),snap=>{
      clients={};snap.forEach(d=>clients[d.id]=d.data());
      $('cli-count').textContent=' ('+snap.size+')';
      renderClients();renderBell();setSync('ok');
    },()=>setSync('error'));
    onSnapshot(doc(db,C_SETTINGS,'main'),snap=>{
      settingsCloud=true;
      if(snap.exists()){settings=normSettings(snap.data());try{localStorage.setItem('sk-settings',JSON.stringify(settings));}catch{}}
      else if(!snap.metadata.fromCache){saveSettings();}
      renderSettingsIfOpen();
    },()=>{settingsCloud=false;renderSettingsIfOpen();});
    subscribeMonth();
    onSnapshot(collection(db,C_VISITS),snap=>{allVisits={};snap.forEach(d=>allVisits[d.id]=d.data());renderClients();renderBell();},()=>{});
  };
  // Reguły Firestore wpuszczają tylko wskazane konta e-mail — logowanie e-mailem i hasłem
  setPersistence(auth,browserLocalPersistence).catch(()=>{});
  onAuthStateChanged(auth,u=>{
    if(u){ $('login').style.display='none'; if(!window.__subbed){window.__subbed=true;go();} }
    else { $('login').style.display='flex'; setSync('error'); }

  renderCalendar();renderDay();
}

    await signInWithEmailAndPassword(auth,email,pass);

    const c=e&&e.code||'';

      :c==='auth/invalid-email'?'Niepoprawny adres e-mail.'
      :'Nieprawidłowy e-mail lub hasło.';

};

const SET_SECTIONS=[
  ['treat','Zabiegi i usługi','spa','np. nowy zabieg…'],
  ['prod','Preparaty','water_drop','np. nowy preparat…'],

    ${SET_SECTIONS.map(([k,title,icon,ph])=>`
      <div class="sec">${ic(icon)} ${title}</div>
      ${settings[k].map((x,i)=>(setEditing&&setEditing.k===k&&setEditing.i===i)
        ?`<div class="setrow"><input class="fi" id="set-edit" value="${esc(x)}" onkeydown="if(event.key==='Enter')setEditSave('${k}',${i})"><button class="ibtn" onclick="setEditSave('${k}',${i})" aria-label="Zapisz">${ic('check')}</button><button class="ibtn" onclick="setEditCancel()" aria-label="Anuluj">${ic('close')}</button></div>`
        :`<div class="setrow"><span class="nm">${esc(x)}</span><button class="ibtn" onclick="setEdit('${k}',${i})" aria-label="Edytuj">${ic('edit')}</button><button class="ibtn del" onclick="setDel('${k}',${i})" aria-label="Usuń">${ic('delete')}</button></div>`
      ).join('')||'<div class="d-sub">Brak pozycji.</div>'}
      <div class="addrow"><input class="fi" id="set-new-${k}" placeholder="${ph}" autocomplete="off" onkeydown="if(event.key==='Enter')setAdd('${k}')"><button type="button" class="mini" onclick="setAdd('${k}')" aria-label="Dodaj">${ic('add')}</button></div>`).join('')}

    <button class="btn" onclick="closeOv('ov-set')">${ic('check')}Gotowe</button>`;
  if(sc)sc.scrollTop=top;
  if(setEditing){const e=$('set-edit');if(e)e.focus();}
}
const dupIn=(k,v,skip)=>settings[k].some((x,i)=>i!==skip&&x.toLowerCase()===v.toLowerCase());
window.setAdd=k=>{
  const inp=$('set-new-'+k),v=inp.value.trim();if(!v)return;
  if(dupIn(k,v,-1)){toast('Taka pozycja już jest');return;}
  settings[k].push(v);saveSettings();renderSettings();toast('Dodano');
  setTimeout(()=>{const e=$('set-new-'+k);if(e)e.focus();},0);
};
window.setEdit=(k,i)=>{setEditing={k,i};renderSettings();};
window.setEditCancel=()=>{setEditing=null;renderSettings();};
window.setEditSave=(k,i)=>{
  const v=$('set-edit').value.trim();

// ─── DZWONEK: wizyty na dziś / jutro bez wysłanego przypomnienia ───
function computeNotifs(){
  const now=new Date(), today=ymd(now), tomorrow=ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1));
  const hm=pad2(now.getHours())+':'+pad2(now.getMinutes());
  return Object.values(allVisits).filter(v=>{
    if(v.date!==today&&v.date!==tomorrow)return false;
    if(visStatus(v))return false;            // obecna / nieobecna / przełożona / inny powód
    if(v.reminderSentAt)return false;
    const c=clients[v.clientId];if(!c||!phoneDigits(c.phone))return false;
    if(v.date===today&&(v.time||'')<hm)return false;   // dzisiejsza wizyta, która już minęła
    return true;
  }).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
}
function renderBell(){
  const n=computeNotifs().length, b=$('bell-badge');
  b.textContent=n>9?'9+':n;b.style.display=n?'flex':'none';
  if($('ov-notif').classList.contains('show'))renderNotifs();
}
function renderNotifs(){
  const list=computeNotifs(), today=todayStr();
  $('notif').innerHTML=`
    <div class="s-title">${ic('notifications')} Powiadomienia</div>
    ${list.length?`<div class="d-sub">Wyślij klientom przypomnienie o wizycie. Dotknij pozycji, aby przejść do terminu.</div>`+list.map(v=>`
      <div class="notif" onclick="goToVisit('${v.id}')">
        <div class="ni">${ic('sms')}</div>
        <div class="nb"><div class="nt">${v.date===today?'Dziś':'Jutro'}, ${esc(v.time||'')} — ${esc(v.clientName||'')}</div>
          <div class="ns">${esc(visTreat(v)||'wizyta')} · wyślij SMS z przypomnieniem</div></div>
        ${ic('chevron_right')}

    <button class="btn ghost" onclick="closeOv('ov-notif')">Zamknij</button>`;
}

// ─── KALENDARZ ───
function subscribeMonth(){
  if(unsubMonth)unsubMonth();
  const last=new Date(calY,calM+1,0).getDate();
  const q=query(collection(db,C_VISITS),where('date','>=',`${calY}-${pad2(calM+1)}-01`),where('date','<=',`${calY}-${pad2(calM+1)}-${pad2(last)}`));
  unsubMonth=onSnapshot(q,snap=>{
    monthVisits={};snap.forEach(d=>monthVisits[d.id]=d.data());
    renderCalendar();renderDay();setSync('ok');
  },()=>setSync('error'));
}
window.changeMonth = d=>{
  calM+=d;if(calM<0){calM=11;calY--;}else if(calM>11){calM=0;calY++;}
  renderCalendar();subscribeMonth();
};
function renderCalendar(){
  $('cal-label').textContent=MIES[calM]+' '+calY;
  const lead=(new Date(calY,calM,1).getDay()+6)%7;
  const dim=new Date(calY,calM+1,0).getDate();
  const cells=Math.ceil((lead+dim)/7)*7, t=todayStr();
  const counts={};Object.values(monthVisits).forEach(v=>{counts[v.date]=(counts[v.date]||0)+1;});
  let h='';
  for(let i=0;i<cells;i++){
    const d=new Date(calY,calM,i-lead+1), s=ymd(d), n=counts[s]||0;
    h+=`<div class="day${d.getMonth()!==calM?' other':''}${n?' has':''}${n&&s<t?' past':''}${s===t?' today':''}${s===curDate?' sel':''}" onclick="selectDay('${s}')">${d.getDate()}${n?`<span class="cnt">${n}</span>`:''}</div>`;
  }
  $('grid').innerHTML=h;
}
window.selectDay = s=>{
  curDate=s;
  const [y,m]=s.split('-').map(Number);
  if(y!==calY||m-1!==calM){calY=y;calM=m-1;subscribeMonth();}
  renderCalendar();renderDay();
};
function renderDay(){
  const list=Object.values(monthVisits).filter(v=>v.date===curDate).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  $('day-title').textContent=(curDate===todayStr()?'Dziś — ':'')+fmtDay(curDate);
  $('day-sub').textContent=list.length?list.length+' wizyt'+(list.length===1?'a':''):'';
  $('day-list').innerHTML=list.length?list.map(v=>`
    <div class="visit st-${visStatus(v)||'none'}" onclick="openVisitDetail('${v.id}')">
      <div class="v-time">${esc(v.time||'')}</div>
      <div class="v-main">
        <div class="v-name">${esc(v.clientName||'')}${visBadges(v)}</div>
        <div class="v-treat">${esc(visTreat(v)||'— brak zabiegu —')}</div>

        ${v.notes?`<div class="v-note">${esc(v.notes)}</div>`:''}

      </div>${v.price>0?`<div class="v-price">${fmtMoney(v.price)}</div>`:''}</div>`).join(''):'<div class="empty">Brak wizyt tego dnia.<br>Dodaj pierwszą przyciskiem +</div>';

  const dig=phoneDigits(phone);
  let f=dig?Object.values(clients).find(c=>c.phone&&phoneDigits(c.phone)===dig):null;
  if(!f)f=Object.values(clients).find(c=>(c.name||'').toLowerCase()===name.toLowerCase());

const SORTS=[['alpha','A–Z','sort_by_alpha'],['bookings','Ilość zapisów','event_note'],['added','Data dodania','person_add']];

  $('sortrow').innerHTML=SORTS.map(([k,l,i])=>`<button class="sbtn${clientSort===k?' active':''}" onclick="setSort('${k}')">${ic(i)}${l}${clientSort===k?ic(sortDirs[k]>0?'arrow_upward':'arrow_downward'):''}</button>`).join('');

window.renderClients = ()=>{
  const st=clientStats();
  renderSortRow();
  // podsumowanie
  const today=todayStr(), ym=today.slice(0,7);
  let total=0,cnt=0,month=0;
  Object.values(allVisits).forEach(v=>{
    if(!(v.price>0)||!countsAsSpent(v))return;
    total+=v.price;cnt++;if(v.date.startsWith(ym))month+=v.price;
  });
  $('cli-sum').innerHTML=`<div><b>${fmtMoney(total)}</b><span>łącznie</span></div><div><b>${fmtMoney(month)}</b><span>ten miesiąc</span></div><div><b>${cnt?fmtMoney(total/cnt):'—'}</b><span>średnio / zabieg</span></div>`;
  const q=($('cli-search').value||'').trim().toLowerCase(), qd=q.replace(/\D/g,'');
  let list=Object.values(clients);
  if(q)list=list.filter(c=>(c.name||'').toLowerCase().includes(q)||(qd.length>=2&&c.phone&&c.phone.replace(/\D/g,'').includes(qd)));
  const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','pl');
  const dir=sortDirs[clientSort];
  if(clientSort==='bookings')list.sort((a,b)=>dir*(((st[a.id]||{}).bookings||0)-((st[b.id]||{}).bookings||0))||byName(a,b));
  else if(clientSort==='added')list.sort((a,b)=>dir*String(a.createdAt||'').localeCompare(String(b.createdAt||''))||byName(a,b));
  else list.sort((a,b)=>dir*byName(a,b));
  $('cli-list').innerHTML=list.length?list.map(c=>{
    const s=st[c.id]||{spent:0,visits:0,noshow:0,bookings:0};
    return `
    <div class="client" onclick="openClient('${c.id}')">
      <div><div class="c-name">${esc(c.name)}</div><div class="c-sub">${esc(c.phone||'brak telefonu')}${c.notes?' · '+ic('keep'):''}${clientSort==='added'&&c.createdAt?' · dodano '+new Date(c.createdAt).toLocaleDateString('pl-PL'):''}</div></div>
      <div class="c-right">${s.spent>0?`<div class="c-spent">${fmtMoney(s.spent)}</div>`:''}<div class="c-vis">${s.bookings?'zapisów: '+s.bookings:'brak zapisów'}${s.noshow?' · '+ic('cancel')+s.noshow:''}</div></div>
    </div>`;}).join(''):'<div class="empty">'+(q?'Brak wyników.':'Baza klientów jest pusta.<br>Klienci dodają się automatycznie przy zapisie wizyty<br>lub przyciskiem poniżej.')+'</div>'
    +'<div style="padding:.5rem .75rem"><button class="btn out" onclick="openClientForm()">'+ic('person_add')+'Dodaj klienta bez wizyty</button></div>';
};

let unsubHist=null;
window.openClient = id=>{
  const c=clients[id];if(!c)return;
  $('cli').innerHTML=`<div class="d-name">${esc(c.name)}</div><div class="d-sub">${esc(c.phone||'brak telefonu')}</div><div class="empty">Ładowanie…</div>`;
  $('ov-cli').classList.add('show');
  if(unsubHist)unsubHist();
  unsubHist=onSnapshot(query(collection(db,C_VISITS),where('clientId','==',id)),snap=>{
    clientVisits={};snap.forEach(d=>clientVisits[d.id]=d.data());
    renderClientCard(id);
  },()=>{clientVisits={};renderClientCard(id);});
};
function renderClientCard(id){
  const c=clients[id];if(!c)return;
  const hist=Object.values(clientVisits).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  $('cli').innerHTML=`
    <div class="d-name">${esc(c.name)}</div>
    <div class="d-sub">${c.phone?`<a href="tel:${esc(c.phone)}" style="color:var(--rose);font-weight:700;text-decoration:none">${esc(c.phone)}</a>`:'brak telefonu'}</div>
    ${(()=>{const s=clientStats()[id]||{spent:0,visits:0,noshow:0,bookings:0};return `<div class="d-row"><span class="l">Wydane łącznie</span><span class="v">${s.spent>0?fmtMoney(s.spent):'—'}</span></div><div class="d-row"><span class="l">Zapisy łącznie</span><span class="v">${s.bookings}</span></div><div class="d-row"><span class="l">Odbyte wizyty</span><span class="v">${s.visits}</span></div>${s.noshow?`<div class="d-row"><span class="l">Nieobecności</span><span class="v"><span class="badge red">${s.noshow}</span></span></div>`:''}`;})()}
    ${c.notes?`<div class="note-box">${ic('keep')} ${esc(c.notes)}</div>`:'<div class="d-sub" style="margin-top:.5rem">Brak uwag — dodaj w „Edytuj”.</div>'}
    <div class="sec">Historia zabiegów (${hist.length})</div>
    ${hist.length?hist.map(v=>`<div class="hist" onclick="closeOv('ov-cli');selectDay('${v.date}');openVisitDetail('${v.id}')">
      <b>${fmtDate(v.date)}</b> ${esc(v.time||'')}${visBadges(v)}<br>
      ${esc(visTreat(v)||'— brak zabiegu —')}${v.price>0?` · <b>${fmtMoney(v.price)}</b>`:''}${v.products&&v.products.length?`<div class="n">${ic('water_drop')} ${esc(v.products.join(', '))}</div>`:''}${v.notes?`<div class="n">${esc(v.notes)}</div>`:''}</div>`).join(''):'<div class="empty" style="padding:1rem">Brak wizyt.</div>'}
    <div style="height:.8rem"></div>
    <button class="btn" onclick="openVisit('${id}')">${ic('add')}Nowa wizyta</button>
    <button class="btn out" onclick="openClientForm('${id}')">${ic('edit')}Edytuj dane klienta</button>
    <button class="btn ghost" onclick="closeClient()">Zamknij</button>
    <button class="btn danger" onclick="deleteClient('${id}')" style="margin-top:1.1rem">${ic('delete')}Usuń klienta</button>`;
}
window.closeClient = ()=>{if(unsubHist){unsubHist();unsubHist=null;}closeOv('ov-cli');};
window.openClientForm = id=>{
  const c=id?clients[id]:null;
  $('cli').innerHTML=`
    <div class="s-title">${c?'Edytuj klienta':'Nowy klient'}</div>
    <div class="fg"><label class="fl">Imię i nazwisko</label><input class="fi" id="ce-name" value="${esc(c?c.name:'')}" autocomplete="off"></div>
    <div class="fg"><label class="fl">Telefon</label><input type="tel" class="fi" id="ce-phone" value="${esc(c?c.phone||'':'')}" onblur="this.value=fmtPhone(this.value)"></div>
    <div class="fg"><label class="fl">Uwagi (stałe: alergie, typ skóry, preferencje…)</label><textarea class="fi" id="ce-notes" rows="4">${esc(c?c.notes||'':'')}</textarea></div>
    <button class="btn" onclick="saveClient('${id||''}')">${ic('check')}Zapisz</button>
    <button class="btn ghost" onclick="${id?`openClient('${id}')`:`closeClient()`}">Anuluj</button>`;
  $('ov-cli').classList.add('show');
};
window.saveClient = async id=>{
  const name=$('ce-name').value.trim(), phone=fmtPhone($('ce-phone').value), notes=$('ce-notes').value.trim();
  if(!name){$('ce-name').classList.add('err');return;}
  const dig=phoneDigits(phone);
  if(dig){
    const o=Object.values(clients).find(x=>x.id!==id&&x.phone&&phoneDigits(x.phone)===dig);
    if(o&&!await confirmBox(`Ten numer ma już klient „${o.name}”. Zapisać mimo to?`,'Zapisz'))return;
  }
  setSync('syncing');
  try{
    if(id){await updateDoc(doc(db,C_CLIENTS,id),{name,phone,notes});clients[id]={...clients[id],name,phone,notes};
      // zaktualizuj nazwę w wizytach klienta, żeby kalendarz był spójny
      for(const v of Object.values(clientVisits)){if(v.clientName!==name)await updateDoc(doc(db,C_VISITS,v.id),{clientName:name});}
      setSync('ok');toast('Zapisano');openClient(id);
    } else {
      const nid=uid();const data={id:nid,name,phone,notes,createdAt:new Date().toISOString()};
      await setDoc(doc(db,C_CLIENTS,nid),data);clients[nid]=data;
      setSync('ok');toast('Dodano klienta');openClient(nid);
    }
  }catch(e){setSync('error');console.error(e);toast('Błąd zapisu: '+(e.code||e.message));}
};
window.deleteClient = async id=>{
  const c=clients[id];if(!c)return;
  if(!await confirmBox(`Usunąć klienta „${c.name}”? Jego wizyty w kalendarzu zostaną.`))return;
  try{await deleteDoc(doc(db,C_CLIENTS,id));closeClient();toast('Klient usunięty');}catch{toast('Błąd usuwania');}
};

// ─── PWA ───
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone){
  const tip=$('install-tip');
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  tip.innerHTML=ic('download')+' Aby zainstalować: '+(ios?'Udostępnij '+ic('ios_share')+' → <b>Dodaj do ekranu początkowego</b>.':'menu przeglądarki '+ic('more_vert')+' → <b>Zainstaluj aplikację</b>.');
  let dismissed=false;try{dismissed=localStorage.getItem('sk-tip')==='1';}catch{}
  if(!dismissed){tip.classList.add('show');tip.onclick=()=>{tip.classList.remove('show');try{localStorage.setItem('sk-tip','1');}catch{}};}
}
</script>
</body>
</html>
